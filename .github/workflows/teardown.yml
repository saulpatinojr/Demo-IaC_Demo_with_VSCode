name: "Teardown labs"

# Deletes lab resource groups. There is also a local equivalent you can run
# from your machine: scripts/Cleanup-Labs.ps1 (supports -WhatIf).
on:
  workflow_dispatch:
    inputs:
      levels:
        description: "Which labs to delete (highest first is safest)"
        type: choice
        required: true
        default: "all"
        options: ["all", "l4", "l3", "l2", "l1"]
      confirm:
        description: 'Type DELETE to confirm'
        type: string
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: teardown
  cancel-in-progress: false

env:
  PREFIX: iacdemo

jobs:
  teardown:
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'DELETE' }}
    steps:
      - name: Preflight - verify required secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=0
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing repo secret '$v'. Run scripts/Setup-Oidc.ps1 first."
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete resource groups (L4 -> L1 order)
        run: |
          set -e
          delete_rg() {
            if az group exists --name "$1" | grep -q true; then
              echo "Deleting $1 ..."
              az group delete --name "$1" --yes
            else
              echo "$1 does not exist, skipping."
            fi
          }
          case "${{ inputs.levels }}" in
            all) for l in l4 l3 l2 l1; do delete_rg "rg-$PREFIX-$l"; done ;;
            *)   delete_rg "rg-$PREFIX-${{ inputs.levels }}" ;;
          esac
