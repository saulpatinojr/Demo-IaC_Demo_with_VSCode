name: "Teardown labs"

# Deletes every resource INSIDE your lab resource group (the group itself is
# left alone — students usually only have Contributor on it, not permission to
# delete it). This matches how the labs deploy: L1-L4 all land in the single
# AZURE_RESOURCE_GROUP, so that group is the unit of teardown.
#
# There is also a local equivalent: scripts/Cleanup-Labs.ps1 -ResourceGroup <rg>
# (supports -WhatIf).
#
# Partial "just tear down L2" is deliberately not offered: both spoke subnets
# route 0.0.0.0/0 at the firewall's private IP, so removing the firewall on its
# own black-holes the surviving VMs while they keep billing. Tear down all of
# it, or leave it running.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only — list what would be deleted, delete nothing"
        type: boolean
        required: false
        default: true
      confirm:
        description: 'Type DELETE to confirm (ignored when dry_run is checked)'
        type: string
        required: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: teardown
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}

jobs:
  teardown:
    runs-on: ubuntu-latest
    # A real delete needs the typed confirmation; a dry run never does.
    if: ${{ inputs.dry_run || inputs.confirm == 'DELETE' }}
    steps:
      - name: Preflight - verify required secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=0
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing repo secret '$v'. Run scripts/Setup-Oidc.ps1 first."
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete every resource in the lab resource group
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          RG="$AZURE_RESOURCE_GROUP"

          if [ "$(az group exists --name "$RG")" != "true" ]; then
            echo "::error::Resource group '$RG' does not exist."
            exit 1
          fi

          mapfile -t ids < <(az resource list --resource-group "$RG" --query '[].id' -o tsv)
          if [ "${#ids[@]}" -eq 0 ]; then
            echo "Resource group '$RG' is already empty. Nothing to do."
            exit 0
          fi

          echo "Found ${#ids[@]} resource(s) in '$RG':"
          az resource list --resource-group "$RG" \
            --query '[].{name:name,type:type}' -o table

          if [ "$DRY_RUN" = "true" ]; then
            echo ""
            echo "::notice::DRY RUN — nothing was deleted. Re-run with dry_run unchecked and confirm=DELETE."
            exit 0
          fi

          # Private DNS virtual-network links are CHILD resources: they never
          # appear in `az resource list`, and a zone refuses to delete while a
          # link still references it. Without this the two L3 privatelink zones
          # survive all three passes below and teardown always exits 1.
          echo "::group::Remove private DNS virtual-network links"
          while read -r zone; do
            [ -n "$zone" ] || continue
            while read -r link; do
              [ -n "$link" ] || continue
              echo "  unlinking $zone/$link"
              az network private-dns link vnet delete \
                --resource-group "$RG" --zone-name "$zone" --name "$link" --yes || true
            done < <(az network private-dns link vnet list \
                       --resource-group "$RG" --zone-name "$zone" --query '[].name' -o tsv)
          done < <(az network private-dns zone list --resource-group "$RG" --query '[].name' -o tsv)
          echo "::endgroup::"

          # Several passes: ARM orders most dependencies within a batch, but
          # some (private endpoints before their parent, NIC before VNet,
          # firewall before its public IP) only clear on a later pass.
          for pass in 1 2 3; do
            mapfile -t ids < <(az resource list --resource-group "$RG" --query '[].id' -o tsv)
            [ "${#ids[@]}" -eq 0 ] && break
            echo "::group::Delete pass $pass (${#ids[@]} remaining)"
            # Don't abort the pass on a single failure — a later pass retries it.
            az resource delete --ids "${ids[@]}" --verbose || true
            echo "::endgroup::"
          done

          mapfile -t leftover < <(az resource list --resource-group "$RG" --query '[].id' -o tsv)
          if [ "${#leftover[@]}" -eq 0 ]; then
            echo "::notice::'$RG' is empty — teardown complete. The group itself was kept."
          else
            echo "::warning::${#leftover[@]} resource(s) still present after 3 passes:"
            printf '  %s\n' "${leftover[@]}"
            echo "::warning::Re-run this workflow, or delete them in the portal."
            exit 1
          fi
