name: "Deploy L2 - Web Tier & Firewall"

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  VM_ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
  LOCATION: eastus2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Lint
        run: az bicep build --file labs/L2-web-tier/main.bicep

      - name: What-if (preview changes)
        run: |
          az deployment sub what-if \
            --name l2-whatif-${{ github.run_number }} \
            --location $LOCATION \
            --parameters labs/L2-web-tier/main.bicepparam

      - name: Deploy
        run: |
          az deployment sub create \
            --name l2-deploy-${{ github.run_number }} \
            --location $LOCATION \
            --parameters labs/L2-web-tier/main.bicepparam

      - name: Show test URL
        run: |
          az deployment sub show --name l2-deploy-${{ github.run_number }} \
            --query properties.outputs.testUrl.value -o tsv
