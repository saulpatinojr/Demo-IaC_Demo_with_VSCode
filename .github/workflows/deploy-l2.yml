name: "Deploy L2 - Web Tier & Firewall"

# Manual only. Prerequisite: L1 deployed with the same prefix.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-l2
  cancel-in-progress: false

env:
  VM_ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
  AZURE_PREFIX: ${{ vars.AZURE_PREFIX || 'iacdemo' }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preflight - verify required secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=0
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP VM_ADMIN_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing repo secret '$v'. Run scripts/Setup-Oidc.ps1 (see Wiki -> Deployment Guide)."
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Lint (compile + linter)
        run: |
          az bicep build --file labs/L2-web-tier/main.bicep --stdout > /dev/null
          # Also compile the parameter file — build alone never reads it, so a
          # bad param name or a missing env var would slip through to deploy.
          az bicep build-params --file labs/L2-web-tier/main.bicepparam --stdout > /dev/null

      - name: What-if (preview changes)
        run: |
          az deployment group what-if \
            --name l2-whatif-${{ github.run_number }} \
            --resource-group $AZURE_RESOURCE_GROUP \
            --parameters labs/L2-web-tier/main.bicepparam

      - name: Deploy
        run: |
          az deployment group create \
            --name l2-deploy-${{ github.run_number }} \
            --resource-group $AZURE_RESOURCE_GROUP \
            --parameters labs/L2-web-tier/main.bicepparam

      - name: Show test URL
        run: |
          az deployment group show --name l2-deploy-${{ github.run_number }} \
            --resource-group $AZURE_RESOURCE_GROUP \
            --query properties.outputs.testUrl.value -o tsv
