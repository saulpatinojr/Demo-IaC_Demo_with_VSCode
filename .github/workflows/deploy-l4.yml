name: "Deploy L4 - Global Scale"

# Manual only. Prerequisite: L3 deployed with the same prefix (passwords must match).
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-l4
  cancel-in-progress: false

env:
  SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
  LOCATION: eastus2   # deployment metadata region only; resource region is set in main.bicepparam

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preflight - verify required secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=0
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID SQL_ADMIN_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing repo secret '$v'. Run scripts/Setup-Oidc.ps1 (see Wiki -> Deployment Guide)."
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Lint (compile + linter)
        run: az bicep build --file labs/L4-global/main.bicep

      - name: What-if (preview changes)
        run: |
          az deployment sub what-if \
            --name l4-whatif-${{ github.run_number }} \
            --location $LOCATION \
            --parameters labs/L4-global/main.bicepparam

      - name: Deploy
        run: |
          az deployment sub create \
            --name l4-deploy-${{ github.run_number }} \
            --location $LOCATION \
            --parameters labs/L4-global/main.bicepparam

      - name: Show Front Door endpoint
        run: |
          az deployment sub show --name l4-deploy-${{ github.run_number }} \
            --query properties.outputs.frontDoorEndpoint.value -o tsv
