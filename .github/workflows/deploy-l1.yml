name: "Deploy L1 - Hub & Spoke"

# Manual only. Runs three stages the workshop teaches: Lint -> What-if -> Deploy.
on:
  workflow_dispatch:

# OIDC login needs id-token: write. Nothing here needs write access to the repo.
permissions:
  id-token: write
  contents: read

# Never let two L1 deploys run at once (they target the same resource group).
concurrency:
  group: deploy-l1
  cancel-in-progress: false

env:
  VM_ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
  LOCATION: eastus2   # deployment metadata region only; resource region is set in main.bicepparam

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail fast with a clear message if setup hasn't been run yet.
      - name: Preflight - verify required secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=0
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID VM_ADMIN_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing repo secret '$v'. Run scripts/Setup-Oidc.ps1 (see Wiki -> Deployment Guide)."
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Lint (compile + linter)
        run: az bicep build --file labs/L1-hub-spoke/main.bicep

      - name: What-if (preview changes)
        run: |
          az deployment sub what-if \
            --name l1-whatif-${{ github.run_number }} \
            --location $LOCATION \
            --parameters labs/L1-hub-spoke/main.bicepparam

      - name: Deploy
        run: |
          az deployment sub create \
            --name l1-deploy-${{ github.run_number }} \
            --location $LOCATION \
            --parameters labs/L1-hub-spoke/main.bicepparam
