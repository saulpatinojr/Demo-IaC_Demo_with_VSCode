name: "Curriculum L2 - Operations & Monitoring"

# Manual only, like every other deploy in this repo. Prerequisite: Level 1
# deployed with the same prefix (that is labs/L1-hub-spoke .. labs/L4-global,
# which the redesign calls L1.1 .. L1.4).
#
# One workflow per LEVEL with a chapter dropdown, rather than one workflow per
# chapter. The redesign has 18 chapters after Level 1; as separate files they
# would bury the four original lab workflows in the Actions tab, and every one
# of them would be the same 60 lines with a different path.
#
# See the Wiki -> Curriculum Level 2 - Monitor for what each chapter builds.
on:
  workflow_dispatch:
    inputs:
      chapter:
        description: "Which chapter to deploy"
        type: choice
        required: true
        default: "L2.1 - Monitoring Fundamentals"
        options:
          - "L2.1 - Monitoring Fundamentals"
          - "L2.2 - Operational Visibility"
      include_web_tier:
        description: "L1.2 (firewall + web tier) is still deployed"
        type: boolean
        required: true
        default: true
      dry_run:
        description: "Stop after what-if — show the changes, deploy nothing"
        type: boolean
        required: true
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: curriculum-l2
  cancel-in-progress: false

env:
  AZURE_PREFIX: ${{ vars.AZURE_PREFIX || 'iacdemo' }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  CURRICULUM_INCLUDE_WEB_TIER: ${{ inputs.include_web_tier }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preflight - verify required secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=0
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing repo secret '$v'. Run scripts/Setup-Oidc.ps1 (see Wiki -> Deployment Guide)."
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1

      # The dropdown label is for humans; this turns it into a path. Keeping
      # the mapping in one place means adding a chapter is two lines: an option
      # above and a case below.
      - name: Resolve chapter to a template path
        id: chapter
        run: |
          case "${{ inputs.chapter }}" in
            "L2.1 - Monitoring Fundamentals") dir="curriculum/L2.1-monitoring-fundamentals" ;;
            "L2.2 - Operational Visibility")  dir="curriculum/L2.2-operational-visibility" ;;
            *) echo "::error::Unknown chapter '${{ inputs.chapter }}'"; exit 1 ;;
          esac
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "slug=$(echo "$dir" | sed 's|curriculum/||; s|[^a-zA-Z0-9]|-|g')" >> "$GITHUB_OUTPUT"
          echo "Deploying $dir"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Lint (compile + linter)
        run: |
          az bicep build --file ${{ steps.chapter.outputs.dir }}/main.bicep --stdout > /dev/null
          # Also compile the parameter file — build alone never reads it, so a
          # bad param name or a missing env var would slip through to deploy.
          az bicep build-params --file ${{ steps.chapter.outputs.dir }}/main.bicepparam --stdout > /dev/null

      - name: What-if (preview changes)
        run: |
          az deployment group what-if \
            --name ${{ steps.chapter.outputs.slug }}-whatif-${{ github.run_number }} \
            --resource-group $AZURE_RESOURCE_GROUP \
            --parameters ${{ steps.chapter.outputs.dir }}/main.bicepparam

      - name: Deploy
        if: ${{ !inputs.dry_run }}
        run: |
          az deployment group create \
            --name ${{ steps.chapter.outputs.slug }}-deploy-${{ github.run_number }} \
            --resource-group $AZURE_RESOURCE_GROUP \
            --parameters ${{ steps.chapter.outputs.dir }}/main.bicepparam

      - name: Summary
        if: ${{ !inputs.dry_run }}
        run: |
          {
            echo "## ${{ inputs.chapter }}"
            echo ""
            echo "Deployed from \`${{ steps.chapter.outputs.dir }}\`."
            echo ""
            az deployment group show \
              --name ${{ steps.chapter.outputs.slug }}-deploy-${{ github.run_number }} \
              --resource-group $AZURE_RESOURCE_GROUP \
              --query properties.outputs -o json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run - nothing was deployed
        if: ${{ inputs.dry_run }}
        run: echo "::notice::Dry run. The what-if above shows what a real run would change."
