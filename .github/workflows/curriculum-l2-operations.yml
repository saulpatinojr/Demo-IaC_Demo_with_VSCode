name: "Curriculum L2 - Operations & Monitoring"

# Manual only, like every other deploy in this repo. Prerequisite: Level 1
# deployed with the same prefix (that is curriculum/L1.1-core-deployment .. curriculum/L1.4-production-platform,
# which the redesign calls L1.1 .. L1.4).
#
# One workflow per LEVEL with a chapter dropdown, rather than one workflow per
# chapter. The redesign has 18 chapters after Level 1; as separate files they
# would bury the four original lab workflows in the Actions tab, and every one
# of them would be the same 60 lines with a different path.
#
# See the Wiki -> Curriculum Level 2 - Monitor for what each chapter builds.
on:
  workflow_dispatch:
    inputs:
      chapter:
        description: "Which chapter to deploy"
        type: choice
        required: true
        default: "L2.1 - Monitoring Fundamentals"
        options:
          - "L2.1 - Monitoring Fundamentals"
          - "L2.2 - Operational Visibility"
          - "L2.3 - Proactive Operations"
          - "L2.4 - Enterprise Monitoring Strategy"
      include_web_tier:
        description: "L1.2 (firewall + web tier) is still deployed"
        type: boolean
        required: true
        default: true
      dry_run:
        description: "Stop after what-if — show the changes, deploy nothing"
        type: boolean
        required: true
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: curriculum-l2
  cancel-in-progress: false

env:
  # Shared workshop deployment identity. These are identifiers, not secrets --
  # authentication happens through the federated credential tied to each
  # classroom fork -- and this classroom environment is deleted after the
  # event. Fork secrets, when present, still take precedence.
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || 'ec772fb1-230b-4d26-a980-4870f847e392' }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || '92247f12-056e-4600-9248-fb43a78491c9' }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || '456beea5-e9a5-4fde-aa3e-f136cf384213' }}
  AZURE_PREFIX: ${{ vars.AZURE_PREFIX }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}
  # Classroom isolation is naming: each workshop GitHub account matches its
  # pre-created resource group, so the fork owner is the default target RG.
  # The AZURE_RESOURCE_GROUP secret still overrides it for self-hosted runs.
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP || github.repository_owner }}
  CURRICULUM_INCLUDE_WEB_TIER: ${{ inputs.include_web_tier }}
  # Read by L2.3. Same variable the L1.3 lab already uses, so a class that set it
  # once does not set it again.
  ALERT_EMAIL: ${{ vars.ALERT_EMAIL || 'you@example.com' }}
  ALERT_EMAIL_SECONDARY: ${{ vars.ALERT_EMAIL_SECONDARY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Classroom forks are pre-staged and need no per-student variables: the
      # prefix defaults to the fork owner's name up to the first hyphen,
      # lowercased and trimmed to the 12 chars the templates allow
      # (User01-TechCon -> user01). Set the AZURE_PREFIX repo variable to
      # override it.
      - name: Resolve resource group and prefix
        run: |
          if [ -z "$AZURE_PREFIX" ]; then
            owner='${{ github.repository_owner }}'
            prefix=$(printf '%s' "${owner%%-*}" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9' | cut -c1-12)
            [ -n "$prefix" ] || prefix=$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9' | cut -c1-12)
            echo "AZURE_PREFIX=$prefix" >> "$GITHUB_ENV"
            export AZURE_PREFIX="$prefix"
          fi
          echo "Prefix '$AZURE_PREFIX' -> resource group '$AZURE_RESOURCE_GROUP'"

      # The dropdown label is for humans; this turns it into a path. Keeping
      # the mapping in one place means adding a chapter is two lines: an option
      # above and a case below.
      - name: Resolve chapter to a template path
        id: chapter
        env:
          CHAPTER: ${{ inputs.chapter }}
        run: |
          case "$CHAPTER" in
            "L2.1 - Monitoring Fundamentals") dir="curriculum/L2.1-monitoring-fundamentals" ;;
            "L2.2 - Operational Visibility")  dir="curriculum/L2.2-operational-visibility" ;;
            "L2.3 - Proactive Operations")    dir="curriculum/L2.3-proactive-operations" ;;
            "L2.4 - Enterprise Monitoring Strategy") dir="curriculum/L2.4-monitoring-strategy" ;;
            *) echo "::error::Unknown chapter '$CHAPTER'"; exit 1 ;;
          esac
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "slug=$(echo "$dir" | sed 's|curriculum/||; s|[^a-zA-Z0-9]|-|g')" >> "$GITHUB_OUTPUT"
          echo "Deploying $dir"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Lint (compile + linter)
        env:
          CHAPTER_DIR: ${{ steps.chapter.outputs.dir }}
        run: |
          az bicep build --file $CHAPTER_DIR/main.bicep --stdout > /dev/null
          # Also compile the parameter file — build alone never reads it, so a
          # bad param name or a missing env var would slip through to deploy.
          az bicep build-params --file $CHAPTER_DIR/main.bicepparam --stdout > /dev/null

      - name: What-if (preview changes)
        env:
          CHAPTER_DIR: ${{ steps.chapter.outputs.dir }}
          CHAPTER_SLUG: ${{ steps.chapter.outputs.slug }}
        run: |
          az deployment group what-if \
            --name $CHAPTER_SLUG-whatif-${{ github.run_number }} \
            --resource-group $AZURE_RESOURCE_GROUP \
            --parameters $CHAPTER_DIR/main.bicepparam

      - name: Deploy
        if: ${{ !inputs.dry_run }}
        env:
          CHAPTER_DIR: ${{ steps.chapter.outputs.dir }}
          CHAPTER_SLUG: ${{ steps.chapter.outputs.slug }}
        run: |
          az deployment group create \
            --name $CHAPTER_SLUG-deploy-${{ github.run_number }} \
            --resource-group $AZURE_RESOURCE_GROUP \
            --parameters $CHAPTER_DIR/main.bicepparam

      - name: Summary
        if: ${{ !inputs.dry_run }}
        env:
          CHAPTER: ${{ inputs.chapter }}
          CHAPTER_DIR: ${{ steps.chapter.outputs.dir }}
          CHAPTER_SLUG: ${{ steps.chapter.outputs.slug }}
        run: |
          {
            echo "## $CHAPTER"
            echo ""
            echo "Deployed from \`$CHAPTER_DIR\`."
            echo ""
            az deployment group show \
              --name $CHAPTER_SLUG-deploy-${{ github.run_number }} \
              --resource-group $AZURE_RESOURCE_GROUP \
              --query properties.outputs -o json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run - nothing was deployed
        if: ${{ inputs.dry_run }}
        run: echo "::notice::Dry run. The what-if above shows what a real run would change."
