name: "Curriculum L1.3 - Multi-Service Application"

# Manual only. Prerequisite: L1.1 deployed with the same prefix.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: curriculum-l1-3
  cancel-in-progress: false

env:
  SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
  ALERT_EMAIL: ${{ vars.ALERT_EMAIL || 'you@example.com' }}
  AZURE_PREFIX: ${{ vars.AZURE_PREFIX }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}
  # Classroom isolation is naming: each workshop GitHub account matches its
  # pre-created resource group, so the fork owner is the default target RG.
  # The AZURE_RESOURCE_GROUP secret still overrides it for self-hosted runs.
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP || github.repository_owner }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Classroom forks are pre-staged and need no per-student variables: the
      # prefix defaults to the fork owner's name up to the first hyphen,
      # lowercased and trimmed to the 12 chars the templates allow
      # (User01-TechCon -> user01). Set the AZURE_PREFIX repo variable to
      # override it.
      - name: Resolve resource group and prefix
        run: |
          if [ -z "$AZURE_PREFIX" ]; then
            owner='${{ github.repository_owner }}'
            prefix=$(printf '%s' "${owner%%-*}" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9' | cut -c1-12)
            [ -n "$prefix" ] || prefix=$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9' | cut -c1-12)
            echo "AZURE_PREFIX=$prefix" >> "$GITHUB_ENV"
            export AZURE_PREFIX="$prefix"
          fi
          echo "Prefix '$AZURE_PREFIX' -> resource group '$AZURE_RESOURCE_GROUP'"

      - name: Preflight - verify required secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=0
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID SQL_ADMIN_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing repo secret '$v'. Classroom forks come pre-staged -- tell your instructor this secret is missing. Self-hosted: run scripts/Setup-Oidc.ps1 (see Wiki -> Deployment Guide)."
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Lint (compile + linter)
        run: |
          az bicep build --file curriculum/L1.3-multi-service-application/main.bicep --stdout > /dev/null
          # Also compile the parameter file — build alone never reads it, so a
          # bad param name or a missing env var would slip through to deploy.
          az bicep build-params --file curriculum/L1.3-multi-service-application/main.bicepparam --stdout > /dev/null

      - name: What-if (preview changes)
        run: |
          az deployment group what-if \
            --name l1-3-whatif-${{ github.run_number }} \
            --resource-group $AZURE_RESOURCE_GROUP \
            --parameters curriculum/L1.3-multi-service-application/main.bicepparam

      - name: Deploy
        run: |
          az deployment group create \
            --name l1-3-deploy-${{ github.run_number }} \
            --resource-group $AZURE_RESOURCE_GROUP \
            --parameters curriculum/L1.3-multi-service-application/main.bicepparam

      - name: Show app URL
        run: |
          az deployment group show --name l1-3-deploy-${{ github.run_number }} \
            --resource-group $AZURE_RESOURCE_GROUP \
            --query properties.outputs.appUrl.value -o tsv
